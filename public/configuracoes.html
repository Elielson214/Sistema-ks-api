<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KS - Configurações</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
body{min-height:100vh;background:#1A3B4C;color:#fff}
.header{background:rgba(0,0,0,0.15);backdrop-filter:blur(4px);padding:16px 24px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,0.1)}
.header .esq{display:flex;align-items:center;gap:12px}
.header .esq img{height:50px;width:auto}
.header .esq a{color:#fff;text-decoration:none;font-size:18px;font-weight:600}
.btn-voltar{background:transparent;color:#fff;border:1px solid #800020;padding:8px 16px;border-radius:8px;cursor:pointer;font-size:14px;transition:.2s}
.btn-voltar:hover{background:#800020}
.container{padding:32px 24px;max-width:1000px;margin:0 auto}
h1{color:#fff;margin-bottom:24px;font-size:26px}
.card{background:#fff;border-radius:12px;padding:24px;margin-bottom:24px;color:#333}
.card h2{color:#800020;margin-bottom:12px;font-size:18px}
.form-group{display:flex;flex-direction:column;margin-bottom:14px}
.form-group label{font-weight:600;margin-bottom:4px;font-size:14px}
.form-group input{padding:10px 14px;border:2px solid #ddd;border-radius:8px;font-size:14px;outline:none;transition:border-color .3s}
.form-group input:focus{border-color:#800020}
.btn{background:#800020;color:#fff;border:none;padding:10px 24px;border-radius:8px;font-weight:600;cursor:pointer;font-size:14px;transition:.2s}
.btn:hover{background:#a00028}
</style>
</head>
<body>
<div class="header">
<div class="esq"><img src="/logo.webp" alt="Logo KS"><a href="dashboard.html">AGÊNCIA KS</a></div>
<button class="btn-voltar" onclick="window.location.href='dashboard.html'">Voltar ao Dashboard</button>
</div>
<div class="container">
<h1>Configurações</h1>
<div class="card">
<h2>Meu Perfil</h2>
<form id="perfilForm">
<div class="form-group"><label for="nome">Nome</label><input type="text" id="nome" required></div>
<div class="form-group"><label for="email">E-mail</label><input type="email" id="email" required></div>
<div class="form-group"><label for="senhaAtual">Senha Atual</label><input type="password" id="senhaAtual"></div>
<div class="form-group"><label for="novaSenha">Nova Senha</label><input type="password" id="novaSenha"></div>
<button type="submit" class="btn">Salvar Alterações</button>
</form>
</div>
<div class="card">
<h2>Preferências do Sistema</h2>
<form id="preferenciasForm">
<div class="form-group"><label for="tema">Tema</label>
<select id="tema"><option value="escuro">Escuro</option><option value="claro">Claro</option></select></div>
<div class="form-group"><label for="audioUra">Áudio padrão URA</label><input type="text" id="audioUra" placeholder="URL do áudio"></div>
<button type="submit" class="btn">Salvar Preferências</button>
</form>
</div>
</div>
<script>
const token=localStorage.getItem('token');if(!token)window.location.href='login.html';
async function carregarPerfil(){try{const r=await fetch('/usuarios/me',{headers:{'Authorization':'Bearer '+token}});const u=await r.json();document.getElementById('nome').value=u.nome;document.getElementById('email').value=u.email}catch(e){}}
document.getElementById('perfilForm').addEventListener('submit',async e=>{e.preventDefault();const dados={nome:document.getElementById('nome').value,email:document.getElementById('email').value,senhaAtual:document.getElementById('senhaAtual').value,novaSenha:document.getElementById('novaSenha').value};const r=await fetch('/usuarios/me',{method:'PUT',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify(dados)});if(r.ok)alert('Perfil atualizado com sucesso');else alert('Erro ao atualizar perfil')});
document.getElementById('preferenciasForm').addEventListener('submit',async e=>{e.preventDefault();const dados={tema:document.getElementById('tema').value,audioUra:document.getElementById('audioUra').value};const r=await fetch('/configuracoes',{method:'PUT',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify(dados)});if(r.ok)alert('Preferências salvas');else alert('Erro ao salvar')});
carregarPerfil();
</script>
</body>
</html>
