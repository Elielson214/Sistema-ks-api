<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KS - URA</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
body{min-height:100vh;background:#1A3B4C;color:#fff}
.header{background:rgba(0,0,0,0.15);backdrop-filter:blur(4px);padding:16px 24px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,0.1)}
.header .esq{display:flex;align-items:center;gap:12px}
.header .esq img{height:50px;width:auto}
.header .esq a{color:#fff;text-decoration:none;font-size:18px;font-weight:600}
.btn-voltar{background:transparent;color:#fff;border:1px solid #800020;padding:8px 16px;border-radius:8px;cursor:pointer;font-size:14px;transition:.2s}
.btn-voltar:hover{background:#800020}
.container{padding:32px 24px;max-width:1000px;margin:0 auto}
h1{color:#fff;margin-bottom:24px;font-size:26px}
.card{background:#fff;border-radius:12px;padding:24px;margin-bottom:24px;color:#333}
.card h2{color:#800020;margin-bottom:12px;font-size:18px}
.form-group{display:flex;flex-direction:column;margin-bottom:14px}
.form-group label{font-weight:600;margin-bottom:4px;font-size:14px}
.form-group input,.form-group select,.form-group textarea{padding:10px 14px;border:2px solid #ddd;border-radius:8px;font-size:14px;outline:none;transition:border-color .3s}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:#800020}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{background:#800020;color:#fff;border:none;padding:10px 24px;border-radius:8px;font-weight:600;cursor:pointer;font-size:14px;transition:.2s}
.btn:hover{background:#a00028}
.btn-cancelar{background:#ddd;color:#333}
.btn-cancelar:hover{background:#ccc}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;color:#333;margin-top:20px}
th{background:#800020;color:#fff;padding:12px 16px;text-align:left;font-size:14px}
td{padding:12px 16px;border-bottom:1px solid #eee;font-size:14px}
.acoes{display:flex;gap:8px}
.btn-editar{background:#0066cc;color:#fff;border:none;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:12px}
.btn-excluir{background:#cc0000;color:#fff;border:none;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:12px}
.sem-registros{text-align:center;padding:32px;color:#999}
</style>
</head>
<body>
<div class="header">
<div class="esq"><img src="/logo.webp" alt="Logo KS"><a href="dashboard.html">AGÊNCIA KS</a></div>
<button class="btn-voltar" onclick="window.location.href='dashboard.html'">Voltar ao Dashboard</button>
</div>
<div class="container">
<h1>URA - Atendimento Automático</h1>
<div class="card">
<h2 id="formTitle">Novo Menu URA</h2>
<form id="uraForm">
<input type="hidden" id="uraId">
<div class="form-group"><label for="nome">Nome do Menu</label><input type="text" id="nome" required></div>
<div class="form-row">
<div class="form-group"><label for="dtmf">Tecla de Atalho (DTMF)</label><input type="text" id="dtmf" maxlength="4" placeholder="Ex: 1, 2, 00"></div>
<div class="form-group"><label for="destino">Destino</label>
<select id="destino">
<option value="atendente">Atendente</option>
<option value="ramal">Ramal</option>
<option value="mensagem">Mensagem</option>
<option value="encerrar">Encerrar</option>
</select></div>
</div>
<div class="form-group"><label for="mensagem">Mensagem de Áudio (texto)</label><textarea id="mensagem" rows="3" placeholder="Texto que será lido ao cliente"></textarea></div>
<div class="form-actions" style="display:flex;gap:12px;justify-content:flex-end">
<button type="button" class="btn btn-cancelar" id="btnCancelar" style="display:none">Cancelar</button>
<button type="submit" class="btn">Salvar Menu</button>
</div>
</form>
</div>
<table>
<thead><tr><th>Menu</th><th>Tecla</th><th>Destino</th><th>Mensagem</th><th>Ações</th></tr></thead>
<tbody id="tabelaUra"></tbody>
</table>
</div>
<script>
const token=localStorage.getItem('token');if(!token)window.location.href='login.html';
const api='/ura/menus';
async function carregarMenus(){try{const r=await fetch(api,{headers:{'Authorization':'Bearer '+token}});const menus=await r.json();const tbody=document.getElementById('tabelaUra');tbody.innerHTML='';if(!menus.length){tbody.innerHTML='<tr><td colspan="5" class="sem-registros">Nenhum menu URA cadastrado</td></tr>';return}
menus.forEach(m=>{tbody.innerHTML+=`<tr><td>${m.nome}</td><td>${m.dtmf||'-'}</td><td>${m.destino}</td><td>${m.mensagem||'-'}</td>
<td class="acoes"><button class="btn-editar" onclick="editarMenu(${m.id},'${m.nome.replace(/'/g,"\\'")}','${(m.dtmf||'').replace(/'/g,"\\'")}','${m.destino}','${(m.mensagem||'').replace(/'/g,"\\'")}')">Editar</button><button class="btn-excluir" onclick="excluirMenu(${m.id})">Excluir</button></td></tr>`})}catch(e){}}
document.getElementById('uraForm').addEventListener('submit',async e=>{e.preventDefault();const id=document.getElementById('uraId').value;const dados={nome:document.getElementById('nome').value,dtmf:document.getElementById('dtmf').value,destino:document.getElementById('destino').value,mensagem:document.getElementById('mensagem').value};try{let url=api;let metodo='POST';if(id){url+='/'+id;metodo='PUT'}
const r=await fetch(url,{method:metodo,headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify(dados)});if(r.ok){resetarForm();carregarMenus()}else{alert('Erro ao salvar')}}catch(e){alert('Erro ao salvar menu')}});
function editarMenu(id,nome,dtmf,destino,mensagem){document.getElementById('formTitle').textContent='Editar Menu';document.getElementById('uraId').value=id;document.getElementById('nome').value=nome;document.getElementById('dtmf').value=dtmf;document.getElementById('destino').value=destino;document.getElementById('mensagem').value=mensagem;document.getElementById('btnCancelar').style.display='inline-block'}
document.getElementById('btnCancelar').addEventListener('click',resetarForm);
function resetarForm(){document.getElementById('formTitle').textContent='Novo Menu URA';document.getElementById('uraId').value='';document.getElementById('uraForm').reset();document.getElementById('btnCancelar').style.display='none'}
async function excluirMenu(id){if(!confirm('Excluir menu?'))return;try{const r=await fetch(api+'/'+id,{method:'DELETE',headers:{'Authorization':'Bearer '+token}});if(r.ok)carregarMenus();else alert('Erro ao excluir')}catch(e){alert('Erro ao excluir')}}
carregarMenus();
</script>
</body>
</html>
