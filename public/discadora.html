<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KS - Discadora</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
body{min-height:100vh;background:#1A3B4C;color:#fff}
.header{background:rgba(0,0,0,0.15);backdrop-filter:blur(4px);padding:16px 24px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,0.1)}
.header .esq{display:flex;align-items:center;gap:12px}
.header .esq img{height:50px;width:auto}
.header .esq a{color:#fff;text-decoration:none;font-size:18px;font-weight:600}
.btn-voltar{background:transparent;color:#fff;border:1px solid #800020;padding:8px 16px;border-radius:8px;cursor:pointer;font-size:14px;transition:.2s}
.btn-voltar:hover{background:#800020}
.container{padding:32px 24px;max-width:1000px;margin:0 auto}
h1{color:#fff;margin-bottom:24px;font-size:26px}
.card{background:#fff;border-radius:12px;padding:24px;margin-bottom:24px;color:#333}
.card h2{color:#800020;margin-bottom:12px;font-size:18px}
.grid-status{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:20px}
.status-item{background:#f5f5f5;padding:16px;border-radius:8px;text-align:center}
.status-item .num{font-size:32px;font-weight:700;color:#800020}
.status-item .label{font-size:14px;color:#555}
.form-group{display:flex;flex-direction:column;margin-bottom:14px}
.form-group label{font-weight:600;margin-bottom:4px;font-size:14px}
.form-group input,.form-group select{padding:10px 14px;border:2px solid #ddd;border-radius:8px;font-size:14px;outline:none;transition:border-color .3s}
.form-group input:focus,.form-group select:focus{border-color:#800020}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{background:#800020;color:#fff;border:none;padding:10px 24px;border-radius:8px;font-weight:600;cursor:pointer;font-size:14px;transition:.2s}
.btn:hover{background:#a00028}
.btn-iniciar{background:#006633}
.btn-iniciar:hover{background:#008844}
.btn-parar{background:#cc0000}
.btn-parar:hover{background:#a30000}
.controles{display:flex;gap:12px;flex-wrap:wrap}
.log-area{background:#1a1a1a;color:#0f0;padding:16px;border-radius:8px;font-family:monospace;font-size:13px;max-height:200px;overflow-y:auto;white-space:pre-wrap;margin-top:16px}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;color:#333;margin-top:20px}
th{background:#800020;color:#fff;padding:12px 16px;text-align:left;font-size:14px}
td{padding:12px 16px;border-bottom:1px solid #eee;font-size:14px}
.sem-registros{text-align:center;padding:32px;color:#999}
@media(max-width:600px){.form-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="header">
<div class="esq"><img src="/logo.webp" alt="Logo KS"><a href="dashboard.html">AGÊNCIA KS</a></div>
<button class="btn-voltar" onclick="window.location.href='dashboard.html'">Voltar ao Dashboard</button>
</div>
<div class="container">
<h1>Discadora</h1>
<div class="card">
<h2>Status da Discadora</h2>
<div class="grid-status">
<div class="status-item"><div class="num" id="totalDiscagens">0</div><div class="label">Total de Ligações</div></div>
<div class="status-item"><div class="num" id="sucessoDiscagens">0</div><div class="label">Com Sucesso</div></div>
<div class="status-item"><div class="num" id="falhaDiscagens">0</div><div class="label">Falhas</div></div>
<div class="status-item"><div class="num" id="emAndamento">0</div><div class="label">Em Andamento</div></div>
</div>
</div>
<div class="card">
<h2>Iniciar Discagem</h2>
<div class="form-row">
<div class="form-group"><label>Campanha</label><select id="campanhaSelect"><option value="">Selecione</option></select></div>
<div class="form-group"><label>Lista de Contatos</label><select id="listaContatos"><option value="">Todos</option></select></div>
</div>
<div class="form-row">
<div class="form-group"><label>Rampa (chamadas simultâneas)</label><input type="number" id="rampa" value="3" min="1" max="20"></div>
<div class="form-group"><label>Intervalo entre tentativas (segundos)</label><input type="number" id="intervalo" value="30" min="5"></div>
</div>
<div class="controles">
<button class="btn btn-iniciar" onclick="iniciarDiscagem()">Iniciar Discagem</button>
<button class="btn btn-parar" onclick="pararDiscagem()">Parar Discagem</button>
</div>
<div class="log-area" id="logDiscadora">Aguardando início...</div>
</div>
<table>
<thead><tr><th>Contato</th><th>Campanha</th><th>Status</th><th>Data/Hora</th></tr></thead>
<tbody id="tabelaDiscagens"></tbody>
</table>
</div>
<script>
const token=localStorage.getItem('token');if(!token)window.location.href='login.html';
let discagensAtivas=false;
async function carregarCampanhas(){try{const r=await fetch('/campanhas',{headers:{'Authorization':'Bearer '+token}});const camp=await r.json();const sel=document.getElementById('campanhaSelect');camp.forEach(c=>{sel.innerHTML+=`<option value="${c.id}">${c.nome}</option>`})}catch(e){}}
async function carregarContatos(){try{const r=await fetch('/contatos',{headers:{'Authorization':'Bearer '+token}});const c=await r.json();const sel=document.getElementById('listaContatos');c.forEach(ct=>{sel.innerHTML+=`<option value="${ct.id}">${ct.nome||ct.telefone}</option>`})}catch(e){}}
async function carregarDiscagens(){try{const r=await fetch('/discagens',{headers:{'Authorization':'Bearer '+token}});const disc=await r.json();const tbody=document.getElementById('tabelaDiscagens');tbody.innerHTML='';if(!disc.length){tbody.innerHTML='<tr><td colspan="4" class="sem-registros">Nenhuma discagem registrada</td></tr>';return}
disc.forEach(d=>{tbody.innerHTML+=`<tr><td>${d.contato_nome||d.telefone||'-'}</td><td>${d.campanha_nome||'-'}</td><td>${d.status}</td><td>${d.data_hora||'-'}</td></tr>`})
document.getElementById('totalDiscagens').textContent=disc.length;
document.getElementById('sucessoDiscagens').textContent=disc.filter(d=>d.status==='sucesso').length;
document.getElementById('falhaDiscagens').textContent=disc.filter(d=>d.status==='falha').length;
document.getElementById('emAndamento').textContent=disc.filter(d=>d.status==='andamento').length;
}catch(e){}}
function iniciarDiscagem(){if(discagensAtivas){alert('Discagem já em andamento');return}
const campanha=document.getElementById('campanhaSelect').value;if(!campanha){alert('Selecione uma campanha');return}
discagensAtivas=true;document.getElementById('logDiscadora').textContent='Discagem iniciada...\n';const log=(msg)=>{document.getElementById('logDiscadora').textContent+=msg+'\n';document.getElementById('logDiscadora').scrollTop=document.getElementById('logDiscadora').scrollHeight}
const rampa=parseInt(document.getElementById('rampa').value);const intervalo=parseInt(document.getElementById('intervalo').value)*1000;
log(`Rampa: ${rampa} | Intervalo: ${intervalo/1000}s`);
fetch('/discagens/iniciar',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({campanha_id:campanha,rampa,intervalo})}).then(r=>r.json()).then(r=>{log(r.msg||'Discagem finalizada');discagensAtivas=false;carregarDiscagens()}).catch(e=>{log('Erro: '+e.message);discagensAtivas=false})}
function pararDiscagem(){fetch('/discagens/parar',{method:'POST',headers:{'Authorization':'Bearer '+token}}).then(r=>r.json()).then(r=>{document.getElementById('logDiscadora').textContent+='Discagem parada.\n';discagensAtivas=false;carregarDiscagens()}).catch(e=>{})}
carregarCampanhas();carregarContatos();carregarDiscagens();
</script>
</body>
</html>
